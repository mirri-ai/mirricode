name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Two products build here: the frozen TypeScript packages (the
      # `typecheck` job covers types only, so a tsdown config or a raw-import
      # failure is invisible there) and the rust `mirri` binary in the shape
      # it actually ships, SPA included.
      - run: pnpm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # `rust-test` is the writer (it compiles the superset); this job only
          # restores, so a PR never spends its time saving a cache it did not
          # improve.
          shared-key: rust-workspace
          save-if: false

      # The shipped shape is not "the SPA builds" or "the engine compiles" —
      # it is the SPA staged into `web-dist/`, embedded in the `mirri`
      # binary and served at `/`. `rust-test` compiles the API-only variant
      # (a bare `.gitkeep` in `web-dist/`), and `stage-web.mjs` is consumed
      # only by the release pipeline, so before this step a broken staging
      # path — a changed Vite `outDir`, a renamed entry — stayed green on
      # every PR and only surfaced at release time.
      - name: Stage the SPA and build the distributable binary
        run: |
          node rust/scripts/stage-web.mjs
          cargo build --manifest-path rust/Cargo.toml -p mirri-cli --locked

      # Build does not imply serve. Ask the binary for `/` and require the
      # SPA shell, which is exactly what a user gets.
      #
      # Scope: a dev-profile `rust-embed` reads `web-dist/` from disk at
      # runtime, so this proves the staging → serve contract, not
      # compile-time embedding. Embedding in the shipped artifact is
      # `rust-native-build`'s release build. Auth is bypassed so the check
      # does not depend on where the SPA fallback sits relative to the auth
      # layer.
      - name: Smoke test the served web UI
        run: |
          set -euo pipefail
          export MIRRICODE_HOME="$(mktemp -d)"
          PORT=18765
          LOG="$RUNNER_TEMP/mirri-web-smoke.log"
          ./rust/target/debug/mirri web --dangerous-bypass-auth --no-open \
            --port "$PORT" --workspace "$PWD" > "$LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ok=false
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/" -o "$RUNNER_TEMP/mirri-index.html" 2>/dev/null; then
              ok=true
              break
            fi
            sleep 0.5
          done
          if [ "$ok" != true ]; then
            echo "::error::the server did not serve GET / within 30s"
            cat "$LOG" >&2
            exit 1
          fi
          if ! grep -q '<div id="app">' "$RUNNER_TEMP/mirri-index.html"; then
            echo "::error::GET / did not return the staged SPA shell"
            head -40 "$RUNNER_TEMP/mirri-index.html" >&2
            cat "$LOG" >&2
            exit 1
          fi
          echo "SPA served at /"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  # The rust agent profile engine must stay consistent with the frozen TS
  # reference on the shared cross-engine fixtures under
  # packages/agent-profile/test/fixtures/: the .md parser corpus
  # (cross-engine/, field-for-field against the TS reference parser) and
  # the list-projection corpus (cross-engine-list/, the discovery/merge
  # wire row semantics of US-C1). The fixtures are checked in; the TS suites
  # that produced them are frozen and no longer run by default.
  # Only mirri-core and its dependencies are compiled, so the job needs
  # no pnpm install.
  rust-agent-md-parity:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Share one cache with `rust-test` instead of keeping a per-job
          # copy: both compile the same workspace, and the job id would
          # otherwise split ~300 MB into two caches that never warm each
          # other. `rust-test` owns the save (it compiles the superset), so
          # this job only restores.
          shared-key: rust-workspace
          save-if: false

      - name: Cross-engine agent profile parity tests
        run: cargo test -p mirri-core --test tools_scope_group agent_md_cross_engine_

      - name: Cross-engine agent profile list-projection parity tests
        run: cargo test -p mirri-core --test tools_scope_group agent_list_cross_engine_

  # The native Rust engine is the shipped core: every crate's unit and
  # integration tests must pass, not just the cross-engine parity fixtures
  # above. Clippy runs with the workspace's deny-warnings posture so a
  # warning cannot land on main through a green test run.
  rust-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # The single cache writer for both rust jobs (see
          # `rust-agent-md-parity`). Save even when the run fails: a red
          # test or a clippy warning still leaves every dependency compiled,
          # and dropping that cache makes the next run pay the full build
          # again for an unrelated fix.
          shared-key: rust-workspace
          cache-on-failure: true

      # The Grep tool spawns `rg`; the ubuntu runner does not ship it, and
      # mirri-core's grep tests exercise the real binary.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Fast fail: process liveness is the one place a Linux-only quirk — a
      # killed but not-yet-reaped child keeps its /proc slot and group id —
      # can silently break the orphan sweep's guarantees. Run the focused
      # suites that depend on it first, so such a regression reports in
      # minutes instead of after the whole workspace run.
      - name: Fast-fail process liveness and orphan sweep tests
        run: |
          cargo test -p mirri-os --lib --locked process::
          cargo test -p mirri-core --lib --locked orphan_sweep::

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # R 层（真实环境层，设计文档 docs/superpowers/specs/2026-11-06-rust-test-execution-optimization-design.md §3/§6）：
  # 失败判定依赖真实环境的测试（真实时间语义窗口、真实子进程抽样、性能探针）
  # 带 #[ignore]，在此独立 job 运行。PR 上非阻塞（continue-on-error +
  # summary 归因"真实环境层红"），nightly 必过（nightly-rust-real-env.yml）。
  # e2e_real_llm（需真实 LLM 凭证）维持手动触发；should_handle_*_rpc_independently
  # 是 G-30 的 panic! 占位桩（永不可运行），按测试名排除。
  # timeout-minutes 按最坏情况估算：单测试挂起 2min×3 超时 + 1 次重试 ≈ 12min，
  # 加上编译与 list，30min 足够兜住并给出明确失败；若多个测试同时挂起（--no-fail-fast
  # 下每个各自计时），由 job 超时兜底——仍是可归因的非阻塞红，不是静默绿。
  rust-real-env:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: rust-workspace
          save-if: false

      - uses: taiki-e/install-action@nextest

      - name: List R-layer suite (selection check)
        run: cargo nextest list --workspace --locked --run-ignored only -E 'not (binary(e2e_real_llm) or test(should_handle_create_rpc_independently) or test(should_handle_plugins_rpc_independently))' --profile real

      # --no-fail-fast: a red run must list ALL failing R-layer tests, not stop
      # at the first — that list is the nightly/owner attribution input.
      # --no-tests=fail: pinned explicitly (nextest's `auto` currently fails, but
      # that default is not a contract; a filter matching nothing must never pass).
      # 2>&1: nextest's reporter (status lines + Summary) goes to stderr, so a
      # stdout-only capture would leave the summary log empty on a healthy run.
      - name: R-layer tests (real profile)
        run: |
          set -o pipefail
          cargo nextest run --workspace --locked --run-ignored only \
            --no-fail-fast \
            --no-tests=fail \
            -E 'not (binary(e2e_real_llm) or test(should_handle_create_rpc_independently) or test(should_handle_plugins_rpc_independently))' --profile real 2>&1 | tee /tmp/nextest-real.log

      - name: Publish failure summary
        if: always()
        run: |
          {
            echo "## rust-real-env（R 层，非阻塞）"
            echo '```'
            if grep -qE 'Summary' /tmp/nextest-real.log 2>/dev/null; then
              grep -E 'FAIL|RETRY|TIMEOUT|Summary' /tmp/nextest-real.log
            else
              echo 'no nextest summary captured — the run did not execute; see the run step log'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The mirri-core zero-IO contract (rust/AGENTS.md 契约 6): core production
  # code must not perform direct fs/process IO — it goes through injected
  # mirri-os traits. The gate script self-tests its stripper, scans core src
  # for banned direct-IO patterns, and checks the dependency tree for
  # forbidden network/DB crates. Node ships on ubuntu-latest; cargo tree
  # needs only the toolchain + Cargo.lock.
  rust-zero-io-gate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Zero-IO gate (mirri-core direct-IO ban)
        run: node scripts/check-zero-io.mjs

      - name: Spawn hygiene gate (raw Command::new ban)
        run: node ../scripts/check-spawn-usage.mjs

  # Test hygiene gate (16-test-execution-strategy.md §4.5): no new bare
  # set_var / bare sleep / missing layer tags beyond the checked-in
  # ratchet baseline. Needs no compilation — pure source scan.
  rust-test-hygiene-gate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Test hygiene gate (env lock / sleep / layer tags)
        run: node scripts/check-test-hygiene.mjs

  # RustSec advisories + license + source gate for the rust workspace
  # (cargo-deny, config in rust/deny.toml). Runs as its own job because it
  # needs no compilation cache — cargo-deny reads Cargo.lock directly.
  rust-deny:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `arguments` must NOT repeat the `check` subcommand: the action's
      # `command` input already defaults to `check` and prepends it, so
      # "… check check" would fail with "invalid value 'check'".
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          arguments: --all-features

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run sherif
      - name: Check rust workspace and desktop versions match the release anchor
        run: node rust/scripts/sync-version.mjs --check
      # scripts/*.test.mjs run on node:test (not vitest), so `pnpm run test`
      # does not collect them; run them directly alongside the other root
      # script checks in this job.
      - name: Root script tests (node:test)
        run: node --test scripts/*.test.mjs rust/scripts/*.test.mjs

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm dlx --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json; do
            echo "Typechecking ${config}"
            pnpm dlx --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck mirri-web (vue-tsc)
        run: pnpm --filter @mirri-ai/mirri-web run typecheck
