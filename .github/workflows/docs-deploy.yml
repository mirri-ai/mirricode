name: Deploy Docs to GitHub Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm -C docs run build

      - name: Generate version endpoints
        run: |
          VERSION=$(node -p "require('./apps/mirri-code/package.json').version")
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Mirri Code version: $VERSION"

          # Write latest (plain text version)
          echo "$VERSION" > docs/.vitepress/dist/latest

          # Write latest.json (with timestamp)
          cat > docs/.vitepress/dist/latest.json << EOF
          {
            "version": "$VERSION",
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
