name: Nix Build

# NOT a PR gate. `ci.yml` already covers what this workflow can prove and
# more: its `build` job stages the SPA into the rust-embed directory, builds
# the distributable `mirri` binary and smoke-tests `GET /` against it, while
# `rust-test` compiles and tests the whole workspace on a clean runner. This
# job's only unique claim is "the flake itself builds", and that claim is
# about `flake.nix`, not about the product.
#
# It used to run on every pull request. Over the 60 runs before 2026-11-05
# roughly 45% were red, and every failure was flake plumbing (fetchPnpmDeps
# hash drift, pnpm's two-document lockfile) rather than a product defect — a
# pnpm major bump alone cost seven commits of pure Nix adaptation and still
# blocked the PR. So it is demoted to on-demand + a weekly canary: the
# "still builds from a pinned sandbox" signal survives without taxing every
# change.
on:
  workflow_dispatch:
  schedule:
    # Mondays 03:17 UTC — off the hour to dodge the scheduled-workflow spike.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  # The flake carries two hand-maintained workspace lists, and this is the
  # only CI coverage for the drift between them and pnpm's workspace. It
  # needs no Nix — a plain source scan — so it stays cheap and would be the
  # last piece worth keeping if the flake itself goes away.
  check-workspace-sync:
    name: Check flake.nix workspace sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check workspace sync
        run: node scripts/check-nix-workspace.mjs

  nix-build:
    name: nix build .#mirri-code
    needs: check-workspace-sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix-path: nixpkgs=channel:nixos-unstable

      # Same binary `ci.yml` smoke-tests; there is no reason to run it here
      # too. A hash mismatch lands in this log verbatim, which is what the
      # `nix-pnpm-deps-hash` skill tells you to read.
      - name: Build
        run: nix build .#mirri-code --print-build-logs
