name: desktop-build

# Builds the Mirri Desktop (Electron) installers for macOS, Windows and Linux.
# Each runner builds the matching-platform Rust `mirri` backend first (web SPA
# staged into the rust-embed source, then mirri-cli --profile dist), then
# packages it with electron-builder.
#
# macOS is signed with a Developer ID certificate + notarized (so it opens on
# any Mac without the "app is damaged" Gatekeeper block) when `sign-macos` is
# true and the Apple secrets are configured. Windows/Linux ship unsigned in v1.
#
# Triggered two ways:
#   - workflow_dispatch: manual ad-hoc builds from the Actions tab.
#   - workflow_call:     called by release.yml to attach installers to a release.
on:
  workflow_dispatch:
    inputs:
      sign-macos:
        description: 'Sign + notarize macOS (needs Apple secrets)'
        required: false
        type: boolean
        default: true
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 5
      upload-artifact-prefix:
        description: 'Prefix for uploaded artifact name'
        required: false
        type: string
        default: 'mirri-desktop'
  workflow_call:
    inputs:
      sign-macos:
        description: 'Sign + notarize macOS (needs Apple secrets)'
        required: false
        type: boolean
        default: false
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 7
      upload-artifact-prefix:
        description: 'Prefix for uploaded artifact name'
        required: false
        type: string
        default: 'mirri-desktop'
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_NOTARIZATION_KEY_P8:
        required: false
      APPLE_NOTARIZATION_KEY_ID:
        required: false
      APPLE_NOTARIZATION_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop installer (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            rust-target: aarch64-apple-darwin
            build-mode: native
            exec: mirri
          - os: macos-15-intel
            target: darwin-x64
            rust-target: x86_64-apple-darwin
            build-mode: native
            exec: mirri
          - os: windows-2025-vs2026
            target: win32-x64
            rust-target: x86_64-pc-windows-msvc
            build-mode: native
            exec: mirri.exe
          - os: ubuntu-24.04
            target: linux-x64
            rust-target: x86_64-unknown-linux-musl
            build-mode: zigbuild
            exec: mirri

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mirri web assets
        # The Rust backend embeds the SPA (rust-embed, default `embedded-web`
        # feature); build the web app before staging it into the rust-embed
        # source directory in the backend build step.
        # MIRRI_WEB_DESKTOP=1 bakes the internal-build banner into the web bundle
        # (see apps/mirri-web/src/components/InternalBuildBanner.vue); only the
        # desktop sets this flag, so the CLI `mirri web` stays banner-free.
        env:
          MIRRI_WEB_DESKTOP: '1'
        run: pnpm --filter @mirri-ai/mirri-web run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup zig (musl static linking)
        if: matrix.build-mode == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          # Pinned: setup-zig@v1 cannot download Zig >= 0.14.1 (new tarball
          # naming), and unpinned-latest reintroduces upstream drift.
          version: '0.17.0'

      - name: Setup cargo-zigbuild
        if: matrix.build-mode == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build Rust backend
        # Stage the web SPA into the rust-embed source directory, compile
        # mirri-cli with --profile dist --locked, then stage the binary where
        # before-pack.cjs expects it (build/backend/<target>/mirri[.exe]).
        # linux-x64 builds a static musl binary via cargo-zigbuild (same route
        # as rust-native-build.yml); the other runners build the native host
        # target. The Electron app does not sign the backend itself in this
        # step — electron-builder signs the whole bundle later.
        shell: bash
        run: |
          set -euo pipefail
          node rust/scripts/stage-web.mjs
          if [ "${{ matrix.build-mode }}" = "zigbuild" ]; then
            cargo zigbuild --manifest-path rust/Cargo.toml --profile dist --locked -p mirri-cli --target "${{ matrix.rust-target }}"
            binary_path="rust/target/${{ matrix.rust-target }}/dist/${{ matrix.exec }}"
          else
            cargo build --manifest-path rust/Cargo.toml --profile dist --locked -p mirri-cli
            binary_path="rust/target/dist/${{ matrix.exec }}"
          fi
          if [ ! -f "$binary_path" ]; then
            echo "::error::built backend binary not found at $binary_path — see the cargo output above" >&2
            exit 1
          fi
          mkdir -p "apps/mirri-desktop/build/backend/${{ matrix.target }}"
          cp "$binary_path" "apps/mirri-desktop/build/backend/${{ matrix.target }}/${{ matrix.exec }}"
          echo "Staged backend binary: $binary_path -> apps/mirri-desktop/build/backend/${{ matrix.target }}/${{ matrix.exec }}"

      - name: Setup macOS keychain (Developer ID)
        id: keychain
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-setup
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare CSC_NAME for electron-builder (macOS)
        if: runner.os == 'macOS' && inputs.sign-macos && steps.keychain.outputs.signing-available == 'true'
        shell: bash
        run: |
          # electron-builder rejects the "Developer ID Application: " prefix in
          # CSC_NAME; strip it so the certificate matches by team name + ID.
          name="${APPLE_SIGNING_IDENTITY}"
          name="${name#Developer ID Application: }"
          echo "CSC_NAME=$name" >> "$GITHUB_ENV"

      - name: Prepare notarization API key (macOS)
        if: runner.os == 'macOS' && inputs.sign-macos && steps.keychain.outputs.signing-available == 'true'
        shell: bash
        env:
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/notary-AuthKey.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY_P8" | base64 -d > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build & package desktop app
        shell: bash
        env:
          # macOS signing is driven by env: when sign-macos and secrets are
          # available, electron-builder signs with the keychain's Developer ID
          # and notarizes via the notary API key; otherwise it builds unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'macOS' && inputs.sign-macos && steps.keychain.outputs.signing-available == 'true') && 'true' || 'false' }}
          CSC_KEYCHAIN: ${{ env.APPLE_KEYCHAIN_PATH }}
          MIRRI_DESKTOP_NOTARIZE: ${{ (runner.os == 'macOS' && inputs.sign-macos && steps.keychain.outputs.signing-available == 'true') && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: pnpm --filter @mirri-ai/mirri-desktop run dist

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS' && steps.keychain.outputs.signing-available == 'true'
        uses: ./.github/actions/macos-keychain-cleanup

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          path: |
            apps/mirri-desktop/dist-app/Mirri-Desktop-*
          if-no-files-found: error
