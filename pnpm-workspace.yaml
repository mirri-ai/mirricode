packages:
  - packages/*
  - apps/*
  # mirri-desktop-lite is managed by its own Hutch toolchain (hutch.lock +
  # hutch-managed node_modules); pnpm must not take it over (ADR-007).
  - '!apps/mirri-desktop-lite' 
  - docs

catalog:
  zod: 4.6.6

# pnpm 12 reads workspace settings only from this file: the `pnpm` field in
# package.json is ignored (with a warning), so an override kept there is
# silently dropped the next time the lockfile is regenerated. These pins moved
# here from that dead field. Selectors whose package the TypeScript retirement
# removed from the tree (the old server's protobufjs/qs/body-parser chain, and
# the desktop-lite app's vite 8) were dropped rather than carried as text that
# matches nothing; `vite@^8.0.0` in particular matched vitest's peer range and
# pulled a second vite major into the tree.
overrides:
  "ssh2@1.17.0>cpu-features": "-"
  "ssh2@1.17.0>nan": "-"
  "linkify-it": "^6.1.0"
  "dompurify": "^3.4.17"
  "fast-uri": "^3.1.9"
  "postcss": "^8.5.23"
  "nanoid": "^3.3.18"
  "js-yaml@^3": "3.15.2"
  "js-yaml@^4": "4.3.2"
  "minimatch@<11": "^11.0.1"
  "brace-expansion@<5": "^5.0.12"
  "source-map-js@<1.2.2": "1.2.2"
  "fflate@<0.8.3": "0.8.3"
  "katex@<0.19.1": "0.19.1"
  "markdown-it@<14.3.3": "14.3.3"
  "tsx>esbuild": "^0.28.2"
  "vitepress>vite": "^6.4.3"
  # GHSA-3g3m-2fjr-6pw4 (glob >=9 <=14.0.1): js-beautify pins ^13.0.6, which
  # is in the vulnerable range. Only this chain is lifted to 14 — the
  # electron-winstaller chain (glob@7 via @electron/asar/rimraf) is outside
  # the advisory range and still relies on the removed callback API.
  "js-beautify>glob": "^14.0.6"
  # A floor, not a lockfile pin: this started as "get off the vulnerable
  # <1.42.3 releases", and pinning the exact version would keep dragging the
  # editor back to whatever was latest the day it was written.
  "prosemirror-view": "^1.42.6"

# Allow Electron's postinstall to extract its prebuilt binary (needed by
# apps/mirri-desktop). Other native deps stay unbuilt and rely on their own
# prebuilds, matching the prior default.
onlyBuiltDependencies:
  - electron

# pnpm 12 requires an explicit verdict for every dependency that declares a
# build script; an unlisted one fails the install with
# ERR_PNPM_IGNORED_BUILDS (it used to be a warning). The keys below were
# placeholder text written by `pnpm approve-builds`.
allowBuilds:
  # Vite/tsdown build through esbuild's postinstall, which links the
  # platform binary. Allowing it keeps the web and desktop builds working
  # on every runner.
  esbuild: true
  # Installs the repo's pre-commit hook. Harmless where hooks are not
  # wanted (CI) and required for contributors.
  simple-git-hooks: true
  # Only needed to package a Windows installer, which no CI job does.
  electron-winstaller: false
