[package]
name = "mirri-test-harness"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Black-box test harness for the Mirri Rust server: a MirriHarness trait, an HTTP/WS client implementation, and a mock LLM factory for testing without real API keys."

[dependencies]
mirri-core = { path = "../mirri-core" }
mirri-server = { path = "../mirri-server" }
mirri-embedded = { path = "../mirri-embedded" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = "0.26"

[dev-dependencies]
mirri-os = { path = "../mirri-os" }
mirri-proto = { path = "../mirri-proto" }
mirri-session-index = { path = "../mirri-session-index" }
mirri-transport = { path = "../mirri-transport" }
tempfile = "3"