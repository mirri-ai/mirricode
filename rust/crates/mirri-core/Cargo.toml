[package]
name = "mirri-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mirri-collaboration = { path = "../mirri-collaboration" }
mirri-proto = { path = "../mirri-proto" }
mirri-persistence = { path = "../mirri-persistence" }
mirri-os = { path = "../mirri-os" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
anyhow = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
jsonschema = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
zip = "2"
async-trait = "0.1"
dirs = "5"

# Image decode/encode/resize for the media pipeline (G-19). Feature set is
# limited to the formats ReadMediaFile supports (PNG, JPEG, GIF, WebP, BMP).
# Pinned to 0.25.9 (MSRV 1.85 — matches the project's rustc; 0.25.10+ needs 1.88).
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
tempfile = "3"
# Paused-clock tests (B3 swarm scheduler ramp/backoff pacing) — additive on
# top of the workspace `full` feature set (mirri-transport precedent).
tokio = { workspace = true, features = ["test-util"] }
