[package]
name = "mirri-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mirri-collaboration = { path = "../mirri-collaboration" }
mirri-proto = { path = "../mirri-proto" }
mirri-persistence = { path = "../mirri-persistence" }
mirri-os = { path = "../mirri-os" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
anyhow = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
jsonschema = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
url = "2"
zip = "9.2"
async-trait = "0.1"

# Image decode/encode/resize for the media pipeline (G-19). Feature set is
# limited to the formats ReadMediaFile supports (PNG, JPEG, GIF, WebP, BMP).
# Pinned to 0.25.9 (MSRV 1.85 — matches the project's rustc; 0.25.10+ needs 1.88).
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
mirri-test-support = { path = "../mirri-test-support" }
# Zero-IO gate boundary: cron-index is test-only here (the gate's cargo-tree
# walk covers normal deps only). Moving it to [dependencies] re-fails the
# rusqlite regression lockout — the CronPersistence seam is the production path.
mirri-cron-index = { path = "../mirri-cron-index" }
tempfile = "3"
# Dev-only: decompressing the .gz in the retention tests' byte-identity
# assertions (the production path goes through mirri-persistence).
flate2 = "1.1"
# Paused-clock tests (B3 swarm scheduler ramp/backoff pacing) — additive on
# top of the workspace `full` feature set (mirri-transport precedent).
tokio = { workspace = true, features = ["test-util"] }
