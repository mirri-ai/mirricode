[package]
name = "mirri-os"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio-stream = "0.1"
nix = { version = "0.29", features = ["process", "signal"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
notify = { workspace = true }
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

# Integration tests for real-machine Windows verification
# (tests/windows_*.rs) need the window-enumeration APIs; production code
# itself uses only the feature set in [target.'cfg(windows)'.dependencies].
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
mirri-test-support = { path = "../mirri-test-support" }
tempfile = "3"
pretty_assertions = "1"
